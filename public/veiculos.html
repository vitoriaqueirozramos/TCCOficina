<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Veículos | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/veiculos.js" defer></script>
  </head>
  <body class="shell">
    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1>Veículos</h1>
          <p>Veículos vinculados aos clientes. Uma ordem de serviço só aceita veículo do próprio cliente.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-primary" id="new-button"><span data-icon="mais"></span>Novo veículo</button>
        </div>
      </header>

      <section class="card" aria-label="Lista de veículos">
        <div class="toolbar">
          <div class="field grow">
            <label for="search">Pesquisar</label>
            <div class="search-input">
              <span data-icon="busca"></span>
              <input id="search" type="search" placeholder="Placa, marca, modelo ou cliente" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="filter-ativo">Situação</label>
            <select id="filter-ativo">
              <option value="all" selected>Todos</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data stacked">
            <thead>
              <tr>
                <th scope="col">Placa</th>
                <th scope="col">Veículo</th>
                <th scope="col">Cliente</th>
                <th scope="col">Situação</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <dialog class="modal " id="form-dialog" aria-labelledby="form-title">
      <div class="modal-header">
        <h2 id="form-title">Novo veículo</h2>
        <button type="button" class="icon-button" data-close-modal aria-label="Fechar"><span data-icon="fechar"></span></button>
      </div>
      <div class="modal-body">
        <form id="form">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="field">
            <label for="f-cliente">Cliente</label>
            <select id="f-cliente" name="id_cliente" required></select>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="f-placa">Placa</label>
              <input id="f-placa" name="placa" type="text" maxlength="10" placeholder="ABC1D23" required autocomplete="off">
            </div>
            <div class="field">
              <label for="f-ano">Ano <span class="optional">(opcional)</span></label>
              <input id="f-ano" name="ano" type="number" min="1900" max="2100" step="1">
            </div>
            <div class="field">
              <label for="f-marca">Marca</label>
              <input id="f-marca" name="marca" type="text" maxlength="60" required autocomplete="off">
            </div>
            <div class="field">
              <label for="f-modelo">Modelo</label>
              <input id="f-modelo" name="modelo" type="text" maxlength="80" required autocomplete="off">
            </div>
            <div class="field">
              <label for="f-cor">Cor <span class="optional">(opcional)</span></label>
              <input id="f-cor" name="cor" type="text" maxlength="40" autocomplete="off">
            </div>
            <div class="field">
              <label for="f-chassi">Chassi <span class="optional">(opcional)</span></label>
              <input id="f-chassi" name="chassi" type="text" maxlength="30" autocomplete="off">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
