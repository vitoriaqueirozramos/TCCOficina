<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Mecânicos | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/mecanicos.js" defer></script>
  </head>
  <body class="shell">
    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1>Mecânicos</h1>
          <p>Equipe técnica da oficina. Somente mecânicos ativos podem receber ordens de serviço.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-primary" id="new-button"><span data-icon="mais"></span>Novo mecânico</button>
        </div>
      </header>

      <section class="card" aria-label="Lista de mecânicos">
        <div class="toolbar">
          <div class="field grow">
            <label for="search">Pesquisar</label>
            <div class="search-input">
              <span data-icon="busca"></span>
              <input id="search" type="search" placeholder="Nome, e-mail ou especialidade" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="filter-ativo">Situação</label>
            <select id="filter-ativo">
              <option value="all" selected>Todos</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data stacked">
            <thead>
              <tr>
                <th scope="col">Mecânico</th>
                <th scope="col">Especialidade</th>
                <th scope="col" class="num">Ordens em andamento</th>
                <th scope="col">Situação</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <dialog class="modal narrow" id="form-dialog" aria-labelledby="form-title">
      <div class="modal-header">
        <h2 id="form-title">Novo mecânico</h2>
        <button type="button" class="icon-button" data-close-modal aria-label="Fechar"><span data-icon="fechar"></span></button>
      </div>
      <div class="modal-body">
        <form id="form">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="field">
            <label for="f-usuario">Conta de acesso</label>
            <select id="f-usuario" name="id_usuario" required></select>
            <span class="hint" id="usuario-hint">Contas são criadas pelo comando <strong>npm run usuario:create</strong>.</span>
          </div>
          <div class="field">
            <label for="f-especialidade">Especialidade</label>
            <input id="f-especialidade" name="especialidade" type="text" maxlength="100" required autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
