<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Minhas ordens | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/mecanico.js" defer></script>
  </head>
  <body class="mechanic">
    <header class="mechanic-bar">
      <div id="mechanic-brand"></div>
      <button type="button" class="btn btn-secondary btn-sm" id="logout-button"><span data-icon="sair"></span>Sair</button>
    </header>

    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1 id="mechanic-title">Minhas ordens</h1>
          <p id="orders-count">Carregando as ordens atribuídas a você…</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-secondary" id="refresh-orders"><span data-icon="atualizar"></span>Atualizar</button>
        </div>
      </header>

      <div class="order-cards" id="assigned-orders" aria-live="polite"></div>
    </main>
  </body>
</html>
