<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Serviços | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/servicos.js" defer></script>
  </head>
  <body class="shell">
    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1>Serviços</h1>
          <p>Catálogo de serviços da oficina, com preço de referência e duração estimada.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-primary" id="new-button"><span data-icon="mais"></span>Novo serviço</button>
        </div>
      </header>

      <section class="card" aria-label="Lista de serviços">
        <div class="toolbar">
          <div class="field grow">
            <label for="search">Pesquisar</label>
            <div class="search-input">
              <span data-icon="busca"></span>
              <input id="search" type="search" placeholder="Nome ou descrição do serviço" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="filter-ativo">Situação</label>
            <select id="filter-ativo">
              <option value="all" selected>Todos</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data stacked">
            <thead>
              <tr>
                <th scope="col">Serviço</th>
                <th scope="col">Duração estimada</th>
                <th scope="col" class="num">Preço</th>
                <th scope="col">Situação</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <dialog class="modal " id="form-dialog" aria-labelledby="form-title">
      <div class="modal-header">
        <h2 id="form-title">Novo serviço</h2>
        <button type="button" class="icon-button" data-close-modal aria-label="Fechar"><span data-icon="fechar"></span></button>
      </div>
      <div class="modal-body">
        <form id="form">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="field">
            <label for="f-nome">Nome</label>
            <input id="f-nome" name="nome" type="text" maxlength="120" required autocomplete="off">
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="f-preco">Preço (R$)</label>
              <input id="f-preco" name="preco_atual" type="number" min="0" step="0.01" required>
            </div>
            <div class="field">
              <label for="f-duracao">Duração estimada em minutos <span class="optional">(opcional)</span></label>
              <input id="f-duracao" name="duracao_minutos" type="number" min="1" max="6000" step="1">
            </div>
          </div>
          <div class="field">
            <label for="f-descricao">Descrição <span class="optional">(opcional)</span></label>
            <textarea id="f-descricao" name="descricao" rows="3"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
