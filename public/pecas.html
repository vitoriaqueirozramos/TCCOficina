<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Peças | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/peca-form.js" defer></script>
    <script src="/pecas.js" defer></script>
  </head>
  <body class="shell">
    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1>Peças</h1>
          <p>Catálogo de peças. O saldo é controlado em Estoque e muda apenas por movimentações.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-primary" id="new-button"><span data-icon="mais"></span>Nova peça</button>
        </div>
      </header>

      <section class="card" aria-label="Lista de peças">
        <div class="toolbar">
          <div class="field grow">
            <label for="search">Pesquisar</label>
            <div class="search-input">
              <span data-icon="busca"></span>
              <input id="search" type="search" placeholder="Código, nome ou descrição" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="filter-ativo">Situação</label>
            <select id="filter-ativo">
              <option value="all" selected>Todos</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data stacked">
            <thead>
              <tr>
                <th scope="col">Código</th>
                <th scope="col">Peça</th>
                <th scope="col">Categoria</th>
                <th scope="col" class="num">Custo</th>
                <th scope="col" class="num">Venda</th>
                <th scope="col" class="num">Saldo</th>
                <th scope="col">Situação</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <dialog class="modal " id="form-dialog" aria-labelledby="form-title">
      <div class="modal-header">
        <h2 id="form-title">Nova peça</h2>
        <button type="button" class="icon-button" data-close-modal aria-label="Fechar"><span data-icon="fechar"></span></button>
      </div>
      <div class="modal-body">
        <form id="form">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div id="peca-fields"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
