<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15232b">
    <title>Clientes | OFICINATECH</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/shared.js" defer></script>
    <script src="/clientes.js" defer></script>
  </head>
  <body class="shell">
    <main class="page" id="conteudo">
      <header class="page-header">
        <div>
          <h1>Clientes</h1>
          <p>Cadastro das pessoas e empresas atendidas pela oficina.</p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn btn-primary" id="new-button"><span data-icon="mais"></span>Novo cliente</button>
        </div>
      </header>

      <section class="card" aria-label="Lista de clientes">
        <div class="toolbar">
          <div class="field grow">
            <label for="search">Pesquisar</label>
            <div class="search-input">
              <span data-icon="busca"></span>
              <input id="search" type="search" placeholder="Nome, documento, telefone ou e-mail" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="filter-ativo">Situação</label>
            <select id="filter-ativo">
              <option value="all" selected>Todos</option>
              <option value="true">Ativos</option>
              <option value="false">Inativos</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data stacked">
            <thead>
              <tr>
                <th scope="col">Cliente</th>
                <th scope="col">Documento</th>
                <th scope="col">Telefone</th>
                <th scope="col">E-mail</th>
                <th scope="col">Situação</th>
                <th scope="col" class="actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </main>

    <dialog class="modal " id="form-dialog" aria-labelledby="form-title">
      <div class="modal-header">
        <h2 id="form-title">Novo cliente</h2>
        <button type="button" class="icon-button" data-close-modal aria-label="Fechar"><span data-icon="fechar"></span></button>
      </div>
      <div class="modal-body">
        <form id="form">
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <div class="field">
            <label for="f-nome">Nome</label>
            <input id="f-nome" name="nome" type="text" maxlength="120" required autocomplete="off">
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="f-documento">CPF ou CNPJ <span class="optional">(opcional)</span></label>
              <input id="f-documento" name="documento" type="text" maxlength="20" autocomplete="off">
            </div>
            <div class="field">
              <label for="f-telefone">Telefone <span class="optional">(opcional)</span></label>
              <input id="f-telefone" name="telefone" type="tel" maxlength="20" placeholder="(41) 99999-0000" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="f-email">E-mail <span class="optional">(opcional)</span></label>
            <input id="f-email" name="email" type="email" maxlength="254" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-endereco">Endereço <span class="optional">(opcional)</span></label>
            <input id="f-endereco" name="endereco" type="text" maxlength="255" placeholder="Rua, número, bairro e cidade" autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="btn btn-primary" id="form-submit">Salvar</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
